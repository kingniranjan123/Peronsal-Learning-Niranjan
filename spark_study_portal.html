<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spark In Action — Engineering Study Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg-deep:    #080E1A;
  --bg-main:    #0D1426;
  --bg-card:    #111D35;
  --bg-sidebar: #091020;
  --bg-hover:   #1A2845;
  --bg-active:  #1E3460;
  --accent:     #3B82F6;
  --accent-2:   #60A5FA;
  --accent-glow:#3B82F620;
  --teal:       #14B8A6;
  --green:      #22C55E;
  --orange:     #F97316;
  --purple:     #A855F7;
  --red:        #EF4444;
  --yellow:     #EAB308;
  --text-1:     #F1F5F9;
  --text-2:     #94A3B8;
  --text-3:     #64748B;
  --border:     #1E2D4A;
  --border-2:   #2A3F5F;
  --radius:     12px;
  --radius-sm:  8px;
  --sidebar-w:  310px;
  --header-h:   58px;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; font-family:'Inter',sans-serif; background:var(--bg-deep); color:var(--text-1); overflow:hidden; }

/* ─── LOGIN ─────────────────────────────────────────────────────── */
#login-screen {
  position:fixed; inset:0; z-index:1000;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 30% 40%, #0a1a4020 0%, transparent 60%),
              radial-gradient(ellipse at 70% 60%, #1a0a3020 0%, transparent 60%),
              linear-gradient(135deg, #080E1A 0%, #0D1426 50%, #080E1A 100%);
}
.login-bg-orb {
  position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none;
}
.orb-1 { width:500px; height:500px; background:#3B82F615; top:-100px; left:-100px; }
.orb-2 { width:400px; height:400px; background:#A855F710; bottom:-100px; right:-100px; }
.orb-3 { width:300px; height:300px; background:#14B8A610; top:50%; left:50%; transform:translate(-50%,-50%); }
.login-card {
  position:relative; z-index:1;
  background: rgba(17,29,53,0.85);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border-2);
  border-radius: 24px;
  padding: 48px 44px;
  width: 440px;
  box-shadow: 0 32px 80px #00000060, 0 0 0 1px #3B82F610;
}
.login-logo {
  display:flex; align-items:center; gap:12px; margin-bottom:32px;
}
.login-logo-icon {
  width:44px; height:44px; border-radius:12px;
  background: linear-gradient(135deg,#3B82F6,#A855F7);
  display:flex; align-items:center; justify-content:center; font-size:22px;
}
.login-logo h1 { font-size:1.4rem; font-weight:700; }
.login-logo span { font-size:.8rem; color:var(--text-2); display:block; }
.login-card h2 { font-size:1.6rem; font-weight:700; margin-bottom:6px; }
.login-card p  { color:var(--text-2); font-size:.9rem; margin-bottom:32px; }
.form-group { margin-bottom:20px; }
.form-group label { display:block; font-size:.82rem; font-weight:500; color:var(--text-2); margin-bottom:8px; letter-spacing:.02em; text-transform:uppercase; }
.form-group input {
  width:100%; padding:13px 16px;
  background:var(--bg-deep); border:1.5px solid var(--border-2);
  border-radius:var(--radius-sm); color:var(--text-1);
  font-family:'Inter',sans-serif; font-size:.95rem;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.form-group input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.login-btn {
  width:100%; padding:14px;
  background: linear-gradient(135deg,#3B82F6,#6366F1);
  border:none; border-radius:var(--radius-sm);
  color:#fff; font-family:'Inter',sans-serif; font-size:1rem; font-weight:600;
  cursor:pointer; transition:all .2s; margin-top:8px;
  box-shadow: 0 4px 20px #3B82F640;
}
.login-btn:hover { transform:translateY(-1px); box-shadow:0 8px 30px #3B82F660; }
.login-btn:active { transform:translateY(0); }
.login-error { color:#EF4444; font-size:.85rem; margin-top:12px; display:none; text-align:center; }
.login-hint { text-align:center; margin-top:20px; color:var(--text-3); font-size:.8rem; }
.login-hint span { color:var(--accent-2); }

/* ─── MAIN APP ──────────────────────────────────────────────────── */
#app { display:none; height:100vh; flex-direction:column; }
#app.visible { display:flex; }

/* Header */
.app-header {
  height:var(--header-h); min-height:var(--header-h);
  background:var(--bg-sidebar);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:16px;
  z-index:10;
}
.app-header .logo { display:flex; align-items:center; gap:10px; min-width:calc(var(--sidebar-w) - 20px); }
.app-header .logo-icon { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#3B82F6,#A855F7); display:flex; align-items:center; justify-content:center; font-size:16px; }
.app-header .logo-text { font-size:1rem; font-weight:700; }
.app-header .logo-sub  { font-size:.7rem; color:var(--text-3); }
.header-search {
  flex:1; display:flex; align-items:center; gap:8px;
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 14px; max-width:380px;
}
.header-search input { background:none; border:none; outline:none; color:var(--text-1); font-family:'Inter',sans-serif; font-size:.88rem; flex:1; }
.header-search svg { color:var(--text-3); flex-shrink:0; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.header-badge { background:linear-gradient(135deg,#3B82F6,#6366F1); padding:5px 12px; border-radius:20px; font-size:.75rem; font-weight:600; }
.user-avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#14B8A6,#3B82F6); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; cursor:pointer; }

/* Layout */
.app-body { display:flex; flex:1; overflow:hidden; }

/* Sidebar */
.sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column;
}
.sidebar::-webkit-scrollbar { width:4px; }
.sidebar::-webkit-scrollbar-track { background:transparent; }
.sidebar::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:4px; }

.sidebar-section { padding:16px 12px 6px; }
.sidebar-section-label { font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--text-3); padding:0 8px; margin-bottom:6px; }

/* Tree Items */
.tree-part { margin-bottom:4px; }
.tree-part-header {
  display:flex; align-items:center; gap:8px;
  padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; transition:all .15s; user-select:none;
  font-size:.85rem; font-weight:600; color:var(--text-2);
}
.tree-part-header:hover { background:var(--bg-hover); color:var(--text-1); }
.tree-part-header.active-part { background:var(--accent-glow); color:var(--accent-2); }
.tree-part-icon { font-size:14px; flex-shrink:0; }
.tree-part-arrow { margin-left:auto; transition:transform .2s; font-size:11px; color:var(--text-3); }
.tree-part-arrow.open { transform:rotate(90deg); }
.tree-part-children { display:none; padding-left:8px; }
.tree-part-children.open { display:block; }

.tree-chapter { margin-bottom:2px; }
.tree-chapter-header {
  display:flex; align-items:center; gap:7px;
  padding:7px 10px; border-radius:var(--radius-sm);
  cursor:pointer; transition:all .15s; user-select:none;
  font-size:.8rem; font-weight:500; color:var(--text-3);
}
.tree-chapter-header:hover { background:var(--bg-hover); color:var(--text-2); }
.tree-chapter-header.active-ch { color:var(--teal); }
.tree-chapter-arrow { margin-left:auto; transition:transform .2s; font-size:10px; }
.tree-chapter-arrow.open { transform:rotate(90deg); }
.tree-chapter-children { display:none; padding-left:12px; }
.tree-chapter-children.open { display:block; }

.tree-topic {
  display:flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:var(--radius-sm);
  cursor:pointer; transition:all .15s; user-select:none;
  font-size:.78rem; color:var(--text-3); margin-bottom:1px;
}
.tree-topic:hover { background:var(--bg-hover); color:var(--text-2); }
.tree-topic.active { background:var(--bg-active); color:var(--accent-2); font-weight:500; }
.tree-topic::before { content:'•'; color:var(--border-2); flex-shrink:0; }
.tree-topic.active::before { color:var(--accent); }

/* Content area */
.content-area {
  flex:1; overflow-y:auto; background:var(--bg-main);
  padding:0;
}
.content-area::-webkit-scrollbar { width:6px; }
.content-area::-webkit-scrollbar-track { background:transparent; }
.content-area::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:4px; }

/* Content inner */
.content-inner { max-width:1100px; margin:0 auto; padding:32px 36px 80px; }

/* Welcome screen */
.welcome-screen { padding:40px; }
.welcome-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:32px; }
.stat-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; position:relative; overflow:hidden;
}
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--teal)); }
.stat-card .stat-num { font-size:2.4rem; font-weight:800; color:var(--accent-2); }
.stat-card .stat-label { font-size:.82rem; color:var(--text-2); margin-top:4px; }
.stat-card .stat-icon { font-size:2rem; position:absolute; right:16px; top:16px; opacity:.3; }

.quick-links { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:20px; }
.quick-link {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:12px; font-size:.85rem; font-weight:500;
}
.quick-link:hover { border-color:var(--accent); background:var(--bg-hover); transform:translateY(-2px); }
.quick-link .ql-icon { font-size:1.4rem; }

/* Topic page */
.topic-header { margin-bottom:28px; }
.topic-breadcrumb { font-size:.75rem; color:var(--text-3); margin-bottom:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.topic-breadcrumb span { color:var(--text-3); }
.topic-breadcrumb .bc-sep { color:var(--border-2); }
.topic-breadcrumb .bc-current { color:var(--accent-2); }
.topic-title { font-size:1.9rem; font-weight:800; margin-bottom:10px; line-height:1.2; }
.topic-title .title-accent { background:linear-gradient(135deg,#3B82F6,#A855F7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.topic-tagline { color:var(--text-2); font-size:.95rem; line-height:1.6; margin-bottom:16px; }
.topic-tags { display:flex; gap:8px; flex-wrap:wrap; }
.tag {
  padding:4px 12px; border-radius:20px; font-size:.73rem; font-weight:600;
  letter-spacing:.03em;
}
.tag-critical { background:#EF444420; color:#EF4444; border:1px solid #EF444430; }
.tag-essential { background:#3B82F620; color:#3B82F6; border:1px solid #3B82F630; }
.tag-good     { background:#22C55E20; color:#22C55E; border:1px solid #22C55E30; }
.tag-part     { background:#A855F720; color:#A855F7; border:1px solid #A855F730; }

/* Sections */
.section { margin-bottom:32px; }
.section-title {
  font-size:1.05rem; font-weight:700; margin-bottom:14px;
  display:flex; align-items:center; gap:8px; color:var(--text-1);
}
.section-title .s-icon { font-size:1.1rem; }
.section-divider { height:1px; background:var(--border); margin-bottom:24px; }

/* Key concepts grid */
.concepts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.concept-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; transition:all .2s;
}
.concept-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.concept-card .cc-icon { font-size:1.6rem; margin-bottom:10px; }
.concept-card .cc-title { font-size:.85rem; font-weight:600; margin-bottom:6px; color:var(--text-1); }
.concept-card .cc-desc  { font-size:.78rem; color:var(--text-2); line-height:1.5; }

/* Info box */
.info-box {
  background:var(--bg-card); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:16px; line-height:1.7;
  font-size:.88rem; color:var(--text-2); border-left:3px solid var(--accent);
}
.info-box strong { color:var(--text-1); }
.info-box.warn { border-left-color:var(--orange); }
.info-box.success { border-left-color:var(--green); }
.info-box.tip { border-left-color:var(--teal); }

/* Data table */
.data-table-wrap { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
.data-table { width:100%; border-collapse:collapse; font-size:.82rem; }
.data-table th { background:var(--bg-deep); color:var(--accent-2); padding:11px 16px; text-align:left; font-weight:600; border-bottom:1px solid var(--border-2); white-space:nowrap; }
.data-table td { padding:10px 16px; color:var(--text-2); border-bottom:1px solid var(--border); vertical-align:top; }
.data-table tr:last-child td { border-bottom:none; }
.data-table tr:hover td { background:var(--bg-hover); }
.data-table .mono { font-family:'JetBrains Mono',monospace; color:var(--orange); font-size:.8rem; }

/* Code block */
.code-block {
  background:#0D1117; border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; margin-bottom:20px;
}
.code-header {
  background:#161B22; border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
}
.code-lang { font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; }
.code-lang.scala  { color:#DC3958; }
.code-lang.python { color:#F8D25C; }
.code-lang.bash   { color:#98C379; }
.code-lang.yaml   { color:#56B6C2; }
.code-lang.java   { color:#E5A24B; }
.code-copy {
  background:var(--bg-hover); border:1px solid var(--border-2); border-radius:6px;
  padding:4px 10px; font-size:.72rem; color:var(--text-2);
  cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif;
}
.code-copy:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.code-copy.copied { background:var(--green); color:#fff; border-color:var(--green); }
.code-block pre { margin:0; padding:0; }
.code-block pre code { padding:18px 20px !important; font-family:'JetBrains Mono',monospace !important; font-size:.82rem !important; line-height:1.65 !important; display:block; overflow-x:auto; }

/* Steps */
.steps { list-style:none; padding:0; }
.steps li {
  display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);
}
.steps li:last-child { border-bottom:none; }
.step-num {
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#3B82F6,#6366F1);
  display:flex; align-items:center; justify-content:center;
  font-size:.75rem; font-weight:700; margin-top:2px;
}
.step-content .step-title { font-size:.88rem; font-weight:600; margin-bottom:4px; }
.step-content .step-desc  { font-size:.82rem; color:var(--text-2); line-height:1.6; }

/* Comparison */
.compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.compare-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.compare-card .cc-head { font-size:.85rem; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.compare-card .cc-head.bad  { color:var(--red); }
.compare-card .cc-head.good { color:var(--green); }
.compare-card ul { list-style:none; }
.compare-card li { font-size:.8rem; color:var(--text-2); padding:5px 0; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:8px; }
.compare-card li:last-child { border-bottom:none; }

/* Project card */
.project-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; margin-bottom:20px;
}
.project-card-header {
  padding:20px 24px;
  background:linear-gradient(135deg, var(--bg-deep), var(--bg-hover));
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px;
}
.project-card-icon { font-size:2.2rem; }
.project-card-meta h3 { font-size:1.2rem; font-weight:700; margin-bottom:4px; }
.project-card-meta p { font-size:.82rem; color:var(--text-2); }
.project-badge { margin-left:auto; padding:5px 12px; border-radius:20px; font-size:.72rem; font-weight:600; background:var(--accent-glow); color:var(--accent-2); border:1px solid var(--accent)40; }
.project-card-body { padding:20px 24px; }
.arch-flow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:16px 0; }
.arch-node { background:var(--bg-deep); border:1px solid var(--border-2); border-radius:var(--radius-sm); padding:8px 14px; font-size:.78rem; font-weight:600; text-align:center; }
.arch-node.highlight { border-color:var(--accent); color:var(--accent-2); }
.arch-arrow { color:var(--text-3); font-size:1.1rem; }
.project-brief-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:16px; }
.project-brief-card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:16px; }
.project-brief-card h4 { color:var(--text-1); font-size:.95rem; margin-bottom:8px; }
.project-brief-card p, .project-brief-card li { color:var(--text-2); line-height:1.65; font-size:.88rem; }
.project-brief-card ul { margin:0; padding-left:18px; }
.project-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.project-link { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:6px; border:1px solid #3B82F650; background:#3B82F61A; color:#DBEAFE; text-decoration:none; font-size:.8rem; font-weight:700; }
.project-link:hover { background:#3B82F630; text-decoration:none; }
.project-architecture-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:16px; }
.project-part-card { background:#0B1324; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:14px; }
.project-part-card h4 { color:var(--text-1); font-size:.9rem; margin-bottom:6px; }
.project-part-card p { color:var(--text-2); line-height:1.55; font-size:.82rem; }
.command-stack { display:grid; gap:14px; }
.command-card { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg-card); }
.command-card-title { padding:12px 16px; color:var(--text-1); font-weight:800; border-bottom:1px solid var(--border); background:var(--bg-deep); }
.command-card-desc { padding:12px 16px 0; color:var(--text-2); line-height:1.55; font-size:.86rem; }
@media (max-width: 900px) {
  .project-brief-grid, .project-architecture-grid { grid-template-columns:1fr; }
}

/* Infra step */
.infra-step {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px;
}
.infra-step-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.infra-step-num { background:linear-gradient(135deg,var(--accent),var(--purple)); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; flex-shrink:0; }
.infra-step-title { font-size:.9rem; font-weight:600; }
.infra-step-desc { font-size:.82rem; color:var(--text-2); line-height:1.6; margin-bottom:12px; }

/* Progress bar */
.progress-bar-wrap { margin-top:20px; }
.progress-bar-label { font-size:.78rem; color:var(--text-3); margin-bottom:6px; display:flex; justify-content:space-between; }
.progress-bar-track { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.progress-bar-fill  { height:100%; background:linear-gradient(90deg,var(--accent),var(--teal)); border-radius:3px; transition:width .6s ease; }

/* Responsive tweaks */
@media(max-width:768px) {
  :root { --sidebar-w:260px; }
  .compare-grid { grid-template-columns:1fr; }
}

/* Animations */

.dlq-item:nth-child(4) .dlq-q-num { background: linear-gradient(135deg,#F97316,#EF4444); }

.dlq-item:nth-child(8) .dlq-q-num { background: linear-gradient(135deg,#EF4444,#EC4899); }
.dlq-item:nth-child(9) .dlq-q-num { background: linear-gradient(135deg,#3B82F6,#A855F7); }
.dlq-item:nth-child(10) .dlq-q-num { background: linear-gradient(135deg,#14B8A6,#22C55E); }

.dlq-q-text { font-size: .9rem; font-weight: 600; color: var(--text-1); flex: 1; line-height: 1.4; }

          { id:'broadcast-variables', title:'Broadcast Variables', tag:'critical', part:'Part 1', chapter:'Ch 3',
            overview:'Broadcast variables solve a critical performance problem: when a large lookup table (e.g., country codes, product catalogue) is needed in a distributed task, without broadcast it gets serialized and sent with EVERY task. With broadcast, it is sent ONCE per executor and cached in memory.',
            code:{lang:'scala',label:'Scala',src:`// ❌ WITHOUT broadcast — country map serialized per task!
val countryMap = Map("US"->"United States","IN"->"India","UK"->"United Kingdom")
val events = sc.textFile("events.csv")
val enriched = events.map { line =>
  val parts = line.split(",")
  val country = countryMap.getOrElse(parts(3), "Unknown")  // ← copy per task!
  (parts(0), country)
}

// ✅ WITH broadcast — sent once per executor, shared by all tasks
val bcMap = sc.broadcast(countryMap)  // Broadcast it!
val enriched = events.map { line =>
  val parts = line.split(",")
  val country = bcMap.value.getOrElse(parts(3), "Unknown")  // ← single copy
  (parts(0), country)
}

// Performance: 10MB map × 1000 tasks = 10GB without broadcast
//              10MB map × 50 executors = 500MB WITH broadcast (20× reduction)

// Cleanup when done
bcMap.unpersist()
bcMap.destroy()`},

import org.apache.spark.streaming.kafka010._

val ssc = new StreamingContext(sc, Seconds(5))

val stream = KafkaUtils.createDirectStream[String, String](
  ssc, LocationStrategies.PreferConsistent,
  ConsumerStrategies.Subscribe[String, String](Set("weblogs"), kafkaParams)
)

// Parse log lines: IP method URL status bytes userAgent
val logPattern = """(\\S+) \\S+ \\S+ \\[.*\\] "(\\S+) (\\S+).*" (\\d+) (\\d+)""".r

val parsed = stream.map(_.value()).flatMap { line =>
  logPattern.findFirstMatchIn(line).map(m =>
    (m.group(1), m.group(2), m.group(3), m.group(4).toInt, m.group(5).toInt)
  )
}

// Compute metrics every 5 seconds
parsed.foreachRDD { rdd =>
  if (!rdd.isEmpty()) {
    val total   = rdd.count()
    val errors  = rdd.filter(_._4 >= 400).count()
    val bytes   = rdd.map(_._5.toLong).sum()
    val topUrls = rdd.map(r => (r._3, 1)).reduceByKey(_ + _)
                     .sortBy(-_._2).take(10)

    val json = s"""{"timestamp":"\${now}","rps":\${total/5.0},"errors":\${errors},"bytes":\${bytes},"topUrls":\${topUrls.toJson}}"""

    // Publish to Kafka "stats" topic
    kafkaProducer.send(new ProducerRecord("stats", json))
  }
}

ssc.start()
ssc.awaitTermination()`},

# Apache Combined Log Format parser
LOG_PATTERN = r'(\\S+) \\S+ (\\S+) \\[([^\\]]+)\\] "(\\S+) (\\S+)[^"]*" (\\d+) (\\d+|-)'

def parse_log(line):
    m = re.match(LOG_PATTERN, line)
    if m:
        return (m.group(1), m.group(2), m.group(3),
                m.group(4), m.group(5), int(m.group(6)),
                int(m.group(7)) if m.group(7) != '-' else 0)
    return None

    StructField("ds", DateType()),
    StructField("yhat", DoubleType()),
    StructField("yhat_lower", DoubleType()),
    StructField("yhat_upper", DoubleType()),
])

@pandas_udf(forecast_schema, PandasUDFType.GROUPED_MAP)
def forecast_item(pdf):
    uid = pdf["item_store_id"].iloc[0]

                daily_seasonality=False, uncertainty_samples=50)

function render(html) {
  const ci = document.getElementById('content-inner');
  ci.innerHTML = `<div class="fade-in">${html}</div>`;
  document.getElementById('content-area').scrollTop = 0;
  if (window.hljs) {
    ci.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  }
}

function codeBlock(code) {
  if (!code) return '';
  const lang = code.lang || 'bash';
  const label = code.label || lang;
  const id = 'cb_' + Math.random().toString(36).substr(2,8);
  return `<div class="code-block">
    <div class="code-header">
      <span class="code-lang ${lang}">${label}</span>
      <button class="code-copy" onclick="copyCode('${id}',this)">Copy</button>
    </div>
    <pre><code id="${id}" class="language-${lang}">${escHtml(code.src)}</code></pre>
  </div>`;
}

function copyCode(id, btn) {
  const code = document.getElementById(id)?.innerText || '';
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function tagBadge(tag) {
  const map = {critical:'tag-critical',essential:'tag-essential',good:'tag-good'};
  const labels = {critical:'⚡ Critical','essential':'✅ Essential','good':'💡 Good-to-Know'};
  return `<span class="tag ${map[tag]||'tag-good'}">${labels[tag]||tag}</span>`;
}

function buildDLQSection(topicId) {
  if (typeof DLQ_DATA === 'undefined') {
    return '<div class="dlq-section"><div class="dlq-not-available">Questions data not loaded. Press Ctrl+Shift+R.</div></div>';
  }
  var data = DLQ_DATA[topicId];
  if (!data || !data.questions || data.questions.length === 0) {
    return '<div class="dlq-section"><div class="dlq-not-available">Deep Learning Questions coming soon for this topic.</div></div>';
  }
  var qBlocks = data.questions;
  var aHtml = '<div class="dlq-section"><div class="dlq-header"><div class="dlq-header-icon">&#127891;</div><div class="dlq-header-text"><h3>Deep Learning Questions</h3><p>10 expert-level questions: beginner to architect to interview</p></div><div class="dlq-badge">' + qBlocks.length + ' QUESTIONS</div></div><div class="dlq-accordion">';
  DLQ_QUESTIONS.forEach(function(def, i) {
    var blk = qBlocks[i] || null;
    var bodyText = blk ? blk.body : 'Content coming soon.';
    var bodyHtml = (typeof marked !== 'undefined') ? marked.parse(bodyText) : '<pre>' + bodyText.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
    aHtml += '<div class="dlq-item" id="dlq-item-' + i + '">';
    aHtml += '<div class="dlq-question" onclick="toggleDLQ(' + i + ')">';
    aHtml += '<div class="dlq-q-num">' + def.num + '</div>';
    aHtml += '<div class="dlq-q-text">' + def.label + '</div>';
    aHtml += '<span class="dlq-q-tag ' + def.tag + '">' + def.tag.toUpperCase() + '</span>';
    aHtml += '<span class="dlq-chevron">&#9654;</span>';
    aHtml += '</div><div class="dlq-answer">' + bodyHtml + '</div></div>';
  });
  if (data.takeaways) {
    var metaHtml = (typeof marked !== 'undefined') ? marked.parse(data.takeaways) : '<pre>' + data.takeaways.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
    aHtml += '<div class="dlq-item" id="dlq-item-meta"><div class="dlq-question" onclick="toggleDLQMeta()"><div class="dlq-q-num" style="background:linear-gradient(135deg,#F59E0B,#EF4444)">&#128204;</div><div class="dlq-q-text">Key Takeaways &amp; References</div><span class="dlq-q-tag rwe">SUMMARY</span><span class="dlq-chevron">&#9654;</span></div><div class="dlq-answer">' + metaHtml + '</div></div>';
  }
  aHtml += '</div></div>';
  return aHtml;
}

function buildBookRefs(topicId, compact=false) {
  if (typeof BOOK_REFS === 'undefined') return '';
  const refs = BOOK_REFS[topicId] || [];
  if (!refs.length) return '';
  const links = refs.slice(0, compact ? 1 : 3).map(ref => {
    const href = `spark_book.pdf#page=${ref.page}`;
    return `<a class="book-ref-link" href="${href}" target="_blank" rel="noopener">Book p.${ref.page}: ${escHtml(ref.title)}</a>`;
  }).join('');
  return `<div class="book-ref-panel ${compact ? 'section-book-ref' : ''}">
    <span class="book-ref-label">Validate in book</span>${links}
  </div>`;
}

function injectSectionBookRefs(container, topicId) {
  const refs = (typeof BOOK_REFS !== 'undefined') ? (BOOK_REFS[topicId] || []) : [];
  if (!refs.length) return;
  container.querySelectorAll('h2, h3').forEach((heading, idx) => {
    if (idx > 8 || heading.closest('.book-ref-panel')) return;
    const holder = document.createElement('div');
    holder.innerHTML = buildBookRefs(topicId, true);
    heading.insertAdjacentElement('afterend', holder.firstElementChild);
  });
}

async function renderMermaidBlocks(container) {
  if (typeof mermaid === 'undefined') return;
  const mermaidStarts = /^(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt)\b/i;
  const blocks = Array.from(container.querySelectorAll('pre code')).filter(block => {
    const text = (block.textContent || '').trim();
    return block.classList.contains('language-mermaid') || mermaidStarts.test(text);
  });
  for (const block of blocks) {
    const source = (block.textContent || '').trim();
    const wrap = document.createElement('div');
    wrap.className = 'educational-visual';
    try {
      if (typeof mermaid.parse === 'function') {
        const ok = await mermaid.parse(source, { suppressErrors: true });
        if (ok === false) continue;
      }
      const id = 'mermaid_' + Math.random().toString(36).slice(2);
      const rendered = await mermaid.render(id, source);
      wrap.innerHTML = `<div class="educational-visual-title">Concept Architecture Diagram</div>${rendered.svg}`;
      block.closest('pre').replaceWith(wrap);
    } catch (err) {
      console.warn('Mermaid render failed', err);
    }
  }
}

function findTopicById(topicId) {
  for (const part of CURRICULUM) {
    for (const chapter of part.chapters || []) {
      for (const topic of chapter.topics || []) {

function wrapSvgText(text, maxChars = 24, maxLines = 4) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(word => {
    const next = line ? `${line} ${word}` : word;
    if (next.length > maxChars && line) {
      lines.push(line);
      line = word;
    } else {
      line = next;
    }
  });
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    const kept = lines.slice(0, maxLines);
    kept[maxLines - 1] = `${kept[maxLines - 1].replace(/\.$/, '')}...`;
    return kept;
  }
  return lines;
}

function svgTextBlock(text, x, y, maxChars = 24, maxLines = 4, size = 15, weight = 700, color = '#334155') {
  return wrapSvgText(text, maxChars, maxLines)
    .map((line, i) => `<text x="${x}" y="${y + i * (size + 4)}" font-size="${size}" font-weight="${weight}" fill="${color}">${escHtml(line)}</text>`)
    .join('');
}

function svgNode(x, y, w, h, title, body, stroke = '#2563eb', fill = '#fff', titleColor = '#0f172a') {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>
    ${svgTextBlock(title, x + 14, y + 25, Math.max(12, Math.floor((w - 28) / 8)), 2, 14, 900, titleColor)}
    ${svgTextBlock(body, x + 14, y + 58, Math.max(12, Math.floor((w - 28) / 8)), 4, 14, 700, '#334155')}`;
}

function svgArrow(x1, y1, x2, y2, color = '#1f2937', dashed = false) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.2" ${dashed ? 'stroke-dasharray="7 7"' : ''} marker-end="url(#arrowHead)"/>`;
}

function svgDefs() {
  return `<defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f2937"></path>
    </marker>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e293b" flood-opacity=".12"/>
    </filter>
  </defs>`;
}

function buildQuizSection(topicId) {
  if (typeof QUIZ_DATA === 'undefined') {
    return '<div class="quiz-section"><div class="dlq-not-available">Quiz data not loaded. Rebuild quiz_data.js and refresh.</div></div>';
  }
  const quiz = QUIZ_DATA[topicId];
  if (!quiz || !quiz.questions || quiz.questions.length === 0) {
    return '<div class="quiz-section"><div class="dlq-not-available">Assessment quiz coming soon for this topic.</div></div>';
  }
  const questions = quiz.questions.slice(0, 50);
  let html = `<div class="quiz-section">
    <div class="dlq-header">
      <div class="dlq-header-icon">&#9989;</div>
      <div class="dlq-header-text"><h3>Assessment Quiz</h3><p>Answer first; then reveal the correction, clarification, and justification.</p></div>
      <div class="dlq-badge">${questions.length} QUESTIONS</div>
    </div>`;
  questions.forEach((q, idx) => {
    const qid = `quiz-${topicId}-${idx}`;
    const options = (q.options && q.options.length) ? q.options : ['True', 'False'];
    html += `<div class="quiz-card" id="${qid}" data-topic="${escHtml(topicId)}" data-index="${idx}">
      <div class="quiz-question-title">${q.number}. ${escHtml(q.question)}</div>
      <div class="quiz-options">`;
    options.forEach(opt => {
      html += `<label class="quiz-option"><input type="radio" name="${qid}" value="${escHtml(opt)}"><span>${escHtml(opt)}</span></label>`;
    });
    html += `</div>
      <button class="quiz-submit" onclick="submitQuizAnswer('${qid}')">Check answer</button>
      <div class="quiz-feedback"></div>
    </div>`;
  });
  return html + '</div>';
}

function normalizeQuizAnswer(value) {
  return String(value || '').trim().replace(/\.$/, '').replace(/^([A-Da-d])\).*/, '$1').toLowerCase();
}

function submitQuizAnswer(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const topicId = card.dataset.topic;
  const idx = Number(card.dataset.index || 0);
  const question = QUIZ_DATA?.[topicId]?.questions?.[idx] || {};
  const answer = question.answer || '';
  const explanation = question.explanation || '';
  const selected = card.querySelector('input[type="radio"]:checked');
  const feedback = card.querySelector('.quiz-feedback');
  if (!selected) {
    feedback.style.display = 'block';
    feedback.innerHTML = '<span class="quiz-result-bad">Choose an answer first.</span>';
    return;
  }
  const correct = normalizeQuizAnswer(answer) && normalizeQuizAnswer(selected.value) === normalizeQuizAnswer(answer);
  card.classList.add('answered');
  card.classList.toggle('correct', correct);
  card.classList.toggle('incorrect', !correct);
  feedback.innerHTML = `${correct ? '<span class="quiz-result-good">Correct.</span>' : '<span class="quiz-result-bad">Not quite.</span>'}<br><strong>Correct answer:</strong> ${answer ? escHtml(answer) : 'Needs review in source file'}<br><strong>Why:</strong> ${explanation ? escHtml(explanation) : 'No explanation was parsed for this question yet. This item is marked for quiz-content cleanup.'}`;
}

function showInfra(sectionId) {
  const section = INFRA_SECTIONS.find(s=>s.id===sectionId);
  if (!section) return;
  setActiveTopicEl(document.getElementById('topic-infra-'+sectionId));

  if (section.markdown) {
    render(`

        <div class="topic-breadcrumb">

          <span class="bc-sep">›</span>

      </div>

      <div id="infra-md-content" class="fundamentals-content">
        <div class="dlq-loading"><div class="dlq-spinner"></div> Loading infrastructure guide...</div>
      </div>
    `);
    fetch(section.markdown)
      .then(res => res.ok ? res.text() : Promise.reject(new Error('Guide not found')))
      .then(md => {

        renderMermaidBlocks(container).then(() => {
          container.querySelectorAll('pre code').forEach(el => {
            if (typeof hljs !== 'undefined') hljs.highlightElement(el);
          });
        });
      })
      .catch(err => {
        const container = document.getElementById('infra-md-content');
        if (container) container.innerHTML = `<div class="dlq-not-available">${escHtml(err.message)}</div>`;
      });
    return;
  }

  let html = `
    <div class="topic-header">
      <div class="topic-breadcrumb">
        <span>🏗️ Infrastructure Setup</span>
        <span class="bc-sep">›</span>
        <span class="bc-current">${section.title}</span>
      </div>
      <h1 class="topic-title"><span class="title-accent">${section.icon} ${section.title}</span></h1>
      <p class="topic-tagline">${section.desc}</p>
    </div>
    <div class="section-divider"></div>
    <div class="section">
      <div class="section-title"><span class="s-icon">📋</span> Step-by-Step Setup</div>
  `;

  section.steps.forEach((step, i) => {
    html += `
      <div class="infra-step">
        <div class="infra-step-header">
          <div class="infra-step-num">${i+1}</div>
          <div class="infra-step-title">${step.title}</div>

        <div class="infra-step-desc">${step.desc}</div>

  });
  html += `</div>`;
  render(html);
}

// ─── Search ──────────────────────────────────────────────────────────────────
function searchTopics(q) {
  if (!q || q.length < 2) return;
  q = q.toLowerCase();
  const results = [];
  CURRICULUM.forEach(part => {
    part.chapters.forEach(ch => {
      ch.topics.forEach(t => {
        if (t.title.toLowerCase().includes(q) || (t.overview||'').toLowerCase().includes(q)) {
          results.push({type:'topic', part, ch, t});
        }
      });
    });
  });
  PROJECTS.forEach(p => {
    if (p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)) {
      results.push({type:'project', p});
    }
  });
  if (results.length === 0) return;
  if (results.length === 1) {
    const r = results[0];
    if (r.type==='topic') showTopic(r.part.id, r.ch.id, r.t.id);
    else showProject(r.p.id);
    return;
  }
  // Show search results
  let html = `
    <h2 style="margin-bottom:20px;">Search Results for "<span style="color:var(--accent-2)">${escHtml(q)}</span>"</h2>
    <div style="display:grid;gap:12px;">
  `;
  results.forEach(r => {
    if (r.type==='topic') {
      html += `<div class="concept-card" style="cursor:pointer" onclick="showTopic('${r.part.id}','${r.ch.id}','${r.t.id}')">
        <div style="font-size:.75rem;color:var(--text-3);margin-bottom:6px;">${r.part.title} › ${r.ch.title}</div>
        <div class="cc-title">${r.t.title}</div>
        <div class="cc-desc">${(r.t.overview||'').substring(0,120)}...</div>
      </div>`;
    } else {
      html += `<div class="concept-card" style="cursor:pointer" onclick="showProject('${r.p.id}')">
        <div style="font-size:.75rem;color:var(--text-3);margin-bottom:6px;">Real-World Project ${r.p.num}</div>
        <div class="cc-title">${r.p.icon} ${r.p.title}</div>
        <div class="cc-desc">${r.p.desc.substring(0,120)}...</div>
      </div>`;
    }
  });
  html += '</div>';
  render(html);
}
